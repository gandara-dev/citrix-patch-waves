name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./tests -CI -Output Detailed

  web-tests:
    name: Console tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Replay every demo run
        run: node --test tests/web/*.test.mjs

  static-analysis:
    name: Static analysis and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $findings = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error)
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) { throw 'PSScriptAnalyzer reported findings.' }
      - name: Validate the sample maintenance file against the schema
        shell: pwsh
        run: |
          $schema = Get-Content ./schemas/maintenance.schema.json -Raw
          if (-not (Get-Content ./samples/lisbon-october.maintenance.json -Raw | Test-Json -Schema $schema)) {
            throw 'The sample does not match schemas/maintenance.schema.json.'
          }

  end-to-end:
    name: Simulated change end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plan, run every scenario, and write the change records
        shell: pwsh
        run: |
          ./scripts/Invoke-PatchWaves.ps1 -Simulation -PlanOnly -OutputDirectory ./artifacts/plan
          $expected = [ordered]@{
            'normal' = 'CompletedWithExceptions'
            'canary-failure' = 'Stopped'
            'wave-over-budget' = 'Stopped'
            'window-closes' = 'WindowClosed'
            'force-logoff' = 'Completed'
          }
          foreach ($scenario in $expected.Keys) {
            $summary = ./scripts/Invoke-PatchWaves.ps1 -Simulation -Scenario $scenario -OutputDirectory "./artifacts/$scenario"
            $summary | Format-List
            if ($summary.Outcome -ne $expected[$scenario]) { throw "$scenario ended $($summary.Outcome), expected $($expected[$scenario])." }
            foreach ($file in 'run.json', 'change-record.md', 'change-record.html', 'journal.jsonl') {
              if (-not (Test-Path "./artifacts/$scenario/$file")) { throw "$scenario did not write $file." }
            }
          }
